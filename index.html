<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive to-do list loaded from JSONPlaceholder.">
  <title>My To-Do List</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      background: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #243b6b;
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 0.5rem;
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      color: #e5eaf5;
    }

    main {
      width: min(100% - 2rem, 1000px);
      margin: 2rem auto;
      flex: 1;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding: 1rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(25, 40, 70, 0.07);
    }

    #count {
      margin: 0;
      font-weight: 700;
      color: #243b6b;
    }

    #refreshButton {
      border: 0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      background: #243b6b;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    #refreshButton:hover {
      background: #18294d;
    }

    #refreshButton:focus-visible,
    .task-card input:focus-visible {
      outline: 3px solid #f4b942;
      outline-offset: 3px;
    }

    #status {
      padding: 1rem;
      text-align: center;
      color: #4b5563;
    }

    #status.error {
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 10px;
    }

    .task-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .task-card {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      padding: 1rem;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(25, 40, 70, 0.05);
    }

    .task-card input {
      width: 1.15rem;
      height: 1.15rem;
      margin-top: 0.15rem;
      accent-color: #16804a;
      flex-shrink: 0;
      cursor: pointer;
    }

    .task-content {
      min-width: 0;
    }

    .task-title {
      margin: 0 0 0.5rem;
      overflow-wrap: anywhere;
      font-weight: 700;
      line-height: 1.4;
    }

    .task-status {
      display: inline-block;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #fff1d6;
      color: #805300;
    }

    .task-card.completed .task-title {
      color: #64748b;
      text-decoration: line-through;
    }

    .task-card.completed .task-status {
      background: #dcfce7;
      color: #166534;
    }

    footer {
      padding: 1rem;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
    }

    @media (min-width: 768px) {
      .task-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      header h1 {
        font-size: 2.2rem;
      }
    }

    @media (min-width: 1024px) {
      .task-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>My To-Do List</h1>
    <p>Small steps make big progress.</p>
  </header>

  <main>
    <section class="summary" aria-label="Task progress">
      <p id="count" aria-live="polite">0 of 12 completed</p>
      <button id="refreshButton" type="button">Reload tasks</button>
    </section>

    <p id="status" role="status" aria-live="polite">Loading...</p>
    <section id="taskList" class="task-grid" aria-label="To-do tasks"></section>
  </main>

  <footer>
    <p>To-Do List Practice Project · HTML, CSS and JavaScript</p>
  </footer>

  <script>
    const taskList = document.querySelector("#taskList");
    const statusMessage = document.querySelector("#status");
    const countMessage = document.querySelector("#count");
    const refreshButton = document.querySelector("#refreshButton");

    let tasks = [];

    function updateCount() {
      const completedTasks = tasks.filter((task) => task.completed).length;
      countMessage.textContent = `${completedTasks} of ${tasks.length} completed`;
    }

    function renderTasks() {
      taskList.replaceChildren();

      tasks.forEach((task) => {
        const card = document.createElement("article");
        card.className = `task-card${task.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark ${task.title} as completed`);

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          card.classList.toggle("completed", task.completed);
          status.textContent = task.completed ? "Completed" : "Not completed";
          updateCount();
        });

        const content = document.createElement("div");
        content.className = "task-content";

        const title = document.createElement("h2");
        title.className = "task-title";
        title.textContent = task.title;

        const status = document.createElement("span");
        status.className = "task-status";
        status.textContent = task.completed ? "Completed" : "Not completed";

        content.append(title, status);
        card.append(checkbox, content);
        taskList.append(card);
      });

      updateCount();
    }

    async function loadTasks() {
      statusMessage.textContent = "Loading...";
      statusMessage.className = "";
      taskList.replaceChildren();
      countMessage.textContent = "0 of 12 completed";
      refreshButton.disabled = true;

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/todos?_limit=12");

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const data = await response.json();

        tasks = data.map((item) => ({
          id: item.id,
          title: item.title,
          completed: item.completed
        }));

        renderTasks();
        statusMessage.textContent = `Showing ${tasks.length} tasks. Tick a box to update its status.`;
      } catch (error) {
        console.error("Could not load tasks:", error);
        tasks = [];
        updateCount();
        statusMessage.textContent =
          "Sorry, we could not load your tasks. Please check your internet connection and try again.";
        statusMessage.className = "error";
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadTasks);
    loadTasks();
  </script>
</body>
</html>
